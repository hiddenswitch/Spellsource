plugins {
  id "base"
  id "com.github.node-gradle.node"
}

apply from: "../gradle/node.gradle"

clean {
  delete 'ts-proto/node_modules/'
}

tasks.register('compileTypescript', YarnTask) {
  dependsOn ':yarnWorkspace'

  // Use the root Yarn release instead of the submodule's legacy nested yarn script.
  args = ['exec', 'tsc', '--project', 'spellsource-ts-proto/ts-proto/tsconfig.json']
  inputs.dir('ts-proto/src/')
  outputs.dir('ts-proto/build/')
}

node {
  nodeProjectDir = rootProject.projectDir
}