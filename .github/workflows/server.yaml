name: Build Server
on:
  push:
    branches: ['develop', 'upgrade/security-release-*']
    tags: ['*']
    paths:
      - 'spellsource-server/**'
      - 'spellsource-game/**'
      - 'spellsource-cards*/**'
      - 'spellsource-protos/**'
      - 'spellsource-common/**'
      - 'spellsource-testutils/**'
      - 'vertx*/**'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/server.yaml'

jobs:
  test-and-deploy-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - run: git lfs checkout
      - name: Checkout public submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init vertx-jooq-fork spellsource-ts-proto/ts-proto
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25.0.5+8.0.LTS'
          distribution: temurin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - name: Install pinned Corepack
        run: npm install --global corepack@0.36.0 && corepack enable
      - name: Run server tests
        run: ./gradlew --no-parallel spellsource-server:test spellsource-cards-git:test
      - name: Retain server test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            spellsource-server/build/test-results/test/
            spellsource-server/build/reports/tests/test/
            spellsource-cards-git/build/test-results/test/
          retention-days: 14
      - name: Build and push server image
        run: ./gradlew spellsource-server:githubDockerPush
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
