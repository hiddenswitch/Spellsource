name: Tests
on:
  push: { }
  pull_request: { }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - run: git lfs checkout
      - name: Checkout public submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init vertx-jooq-fork spellsource-ts-proto/ts-proto
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25.0.5+8.0.LTS'
          distribution: temurin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - name: Install pinned Corepack
        run: npm install --global corepack@0.36.0 && corepack enable
      - name: Test with Gradle
        run: ./gradlew --no-parallel spellsource-cards-git:test
