name: Build Website
on:
  push:
    branches: ['develop', 'upgrade/security-release-*']
    paths:
      - spellsource-web/**
      - spellsource-threejs/**
      - package.json
      - settings.gradle
      - gradle/**
      - buildSrc/**
      - build.gradle
      - .github/workflows/website.yaml
      - yarn.lock

jobs:
  build-and-deploy-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout public submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init vertx-jooq-fork spellsource-ts-proto/ts-proto
      - uses: actions/setup-java@v4
        with:
          java-version: '25.0.5+8'
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Install pinned Corepack
        run: npm install --global corepack@0.36.0 && corepack enable
      - name: Set Project Version
        run: |
          COMMIT_SHA=$(git rev-parse --short=7 HEAD)
          TIMESTAMP=$(date +%s)
          if [[ "$GITHUB_REF_NAME" == upgrade/security-release-* ]]; then
            echo "PROJECT_VERSION=candidate-${COMMIT_SHA}-${TIMESTAMP}" >> $GITHUB_ENV
          else
            echo "PROJECT_VERSION=${COMMIT_SHA}-${TIMESTAMP}" >> $GITHUB_ENV
          fi
      - name: Build and push website image
        run: ./gradlew spellsource-web:githubDockerPush
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_VERSION: ${{ env.PROJECT_VERSION }}
