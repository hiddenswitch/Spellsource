name: Production Smoke

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Website', 'Build Server', 'Build GraphQL Gateway']
    types: [completed]

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout the workspace submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init spellsource-ts-proto/ts-proto
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - name: Install pinned Corepack
        run: npm install --global corepack@0.36.0 && corepack enable
      - name: Install
        run: yarn install
      - name: Install browser
        run: yarn workspace spellsource-web playwright install --with-deps chromium
      - name: Smoke test the deployed site
        run: yarn workspace spellsource-web test-production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: production-smoke-report
          path: |
            spellsource-web/playwright-report
            spellsource-web/test-results
          retention-days: 14
