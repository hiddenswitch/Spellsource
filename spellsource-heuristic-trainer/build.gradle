plugins {
    id 'java'
    id 'application'
    id 'com.google.cloud.tools.jib' version "$googleContainerToolsJibVersion"
}

apply from: '../gradle/instrument.gradle'

application {
    mainClass = 'com.hiddenswitch.spellsource.trainer.TrainerMain'
}

tasks.named('processResources') {
    from('../.claude/scripts') {
        include 'hearthstone-cards.json'
    }
}

dependencies {
    implementation project(':spellsource-game')
    implementation project(':spellsource-cards-git')
    implementation project(':spellsource-cards-private')
    implementation 'org.moeaframework:moeaframework:4.5'
    implementation 'org.mlflow:mlflow-client:2.19.0'
    implementation 'redis.clients:jedis:5.2.0'
    implementation "com.google.code.gson:gson:2.11.0"
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'
}

jib {
    from {
        image = 'eclipse-temurin:27-jre'
    }
    to {
        image = 'harbor.appmana.com/appmana/spellsource-trainer'
        tags = ['latest'] as Set
    }
    container {
        mainClass = 'com.hiddenswitch.spellsource.trainer.TrainerMain'
        format = 'Docker'
        jvmFlags = ['--enable-preview', '-XX:+UseContainerSupport', '-XX:MaxRAMPercentage=60.0']
    }
}

// kubectl honors KUBECONFIG and the active context.
def trainerNamespace = providers.gradleProperty('namespace').orElse('spellsource')
def renderedTrainer = layout.buildDirectory.file('jobset-rendered.yaml')
def jobsetYamlFile = layout.projectDirectory.file('k8s/jobset.yaml').asFile
def trainerDefaults = [replicas: '7', generations: '50', population: '12',
    matchupsPerEval: '20', gamesPerMatchup: '6', gsvbDepth: '2', gsvbTimeout: '5000',
    sigma: '20.0', mlflowUri: 'http://mlflow.appmana.svc.cluster.local', session: '', gameTimeout: '90000',
    cpuRequest: '8', cpuLimit: '16', memoryRequest: '12Gi', memoryLimit: '24Gi',
    trainerImage: 'harbor.appmana.com/appmana/spellsource-trainer:latest', namespace: 'spellsource']
def trainerProviders = trainerDefaults.collectEntries { key, fallback ->
    [(key): providers.gradleProperty(key).orElse(fallback)]
}
tasks.register('renderTrainer') {
    group = 'deployment'
    description = 'Render an ad hoc trainer JobSet without starting it'
    inputs.file(jobsetYamlFile).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(renderedTrainer)
    doLast {
        def names = [replicas: 'REPLICAS', generations: 'GENERATIONS', population: 'POPULATION',
            matchupsPerEval: 'MATCHUPS_PER_EVAL', gamesPerMatchup: 'GAMES_PER_MATCHUP',
            gsvbDepth: 'GSVB_DEPTH', gsvbTimeout: 'GSVB_TIMEOUT', sigma: 'SIGMA', mlflowUri: 'MLFLOW_URI',
            session: 'SESSION', gameTimeout: 'GAME_TIMEOUT', cpuRequest: 'CPU_REQUEST', cpuLimit: 'CPU_LIMIT',
            memoryRequest: 'MEMORY_REQUEST', memoryLimit: 'MEMORY_LIMIT', trainerImage: 'IMAGE', namespace: 'NAMESPACE']
        def manifest = jobsetYamlFile.text
        trainerProviders.each { key, valProvider ->
            def value = valProvider.get()
            if (value.contains('\n') || value.contains('"') || value.contains('\\')) {
                throw new GradleException("Invalid trainer property ${key}")
            }
            manifest = manifest.replace('${' + names[key] + '}', value)
        }
        def output = renderedTrainer.get().asFile
        output.parentFile.mkdirs()
        output.text = manifest
        logger.lifecycle("Rendered ${output}")
    }
}
tasks.register('deployTrainer') {
    def execOps = services.get(org.gradle.process.ExecOperations)
    group = 'deployment'
    description = 'Build and explicitly launch an ad hoc trainer JobSet'
    dependsOn 'jib', 'renderTrainer'
    doLast {
        // Preserve an existing run. Delete it explicitly before launching another.
        execOps.exec { commandLine 'kubectl', 'create', '-f', renderedTrainer.get().asFile.absolutePath }
        execOps.exec { commandLine 'kubectl', 'patch', 'jobset', 'gsvb-trainer', '-n', trainerNamespace.get(),
            '--type=merge', '-p', '{"spec":{"suspend":false}}' }
    }
}
tasks.register('deleteTrainer') {
    def execOps = services.get(org.gradle.process.ExecOperations)
    group = 'deployment'
    doLast { execOps.exec { commandLine 'kubectl', 'delete', 'jobset', 'gsvb-trainer', '-n', trainerNamespace.get(), '--ignore-not-found' } }
}
tasks.register('trainerStatus') {
    def execOps = services.get(org.gradle.process.ExecOperations)
    group = 'deployment'
    doLast {
        execOps.exec { commandLine 'kubectl', 'get', 'jobset', 'gsvb-trainer', '-n', trainerNamespace.get(), '-o', 'wide' }
        execOps.exec { commandLine 'kubectl', 'get', 'pods', '-n', trainerNamespace.get(), '-l', 'jobset.sigs.k8s.io/jobset-name=gsvb-trainer' }
    }
}
