apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: gsvb-trainer
  namespace: ${NAMESPACE}
spec:
  suspend: true
  replicatedJobs:
    - name: island
      replicas: ${REPLICAS}
      template:
        spec:
          completionMode: Indexed
          completions: 1
          parallelism: 1
          template:
            spec:
              restartPolicy: Never
              serviceAccountName: mlflow-trainer
              volumes:
                - name: keycloak-assertion
                  projected:
                    defaultMode: 0440
                    sources:
                      - serviceAccountToken:
                          audience: https://login.appmana.com/realms/appmana
                          expirationSeconds: 600
                          path: assertion
              containers:
                - name: trainer
                  image: ${IMAGE}
                  command:
                    - java
                    - --enable-preview
                    - -XX:+UseContainerSupport
                    - -Xmx8g
                    - -XX:+UseG1GC
                    - -Djava.util.concurrent.ForkJoinPool.common.parallelism=6
                    - -cp
                    - "@/app/jib-classpath-file"
                    - com.hiddenswitch.spellsource.trainer.TrainerMain
                  args:
                    - local
                    - --algorithm=ga
                    - --num-islands=${REPLICAS}
                    - --generations=${GENERATIONS}
                    - --population=${POPULATION}
                    - --matchups-per-eval=${MATCHUPS_PER_EVAL}
                    - --games-per-matchup=${GAMES_PER_MATCHUP}
                    - --gsvb-depth=${GSVB_DEPTH}
                    - --gsvb-timeout=${GSVB_TIMEOUT}
                    - --sigma=${SIGMA}
                    - --mlflow-uri=${MLFLOW_URI}
                    - --session=${SESSION}
                    - --game-timeout=${GAME_TIMEOUT}
                  env:
                    - name: JAVA_TOOL_OPTIONS
                      value: "-XX:MaxRAMPercentage=55.0 -Djava.util.concurrent.ForkJoinPool.common.parallelism=6"
                    - name: ISLAND_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
                    - name: MLFLOW_TRACKING_AUTH
                      value: oidc-client-credentials
                    - name: MLFLOW_OIDC_ISSUER_URL
                      value: https://login.appmana.com/realms/appmana
                    - name: MLFLOW_OIDC_CLIENT_ID
                      value: spellsource-mlflow-trainer
                    - name: MLFLOW_OIDC_CLIENT_ASSERTION_FILE
                      value: /var/run/secrets/keycloak/assertion
                  volumeMounts:
                    - name: keycloak-assertion
                      mountPath: /var/run/secrets/keycloak
                      readOnly: true
                  resources:
                    requests:
                      cpu: "${CPU_REQUEST}"
                      memory: ${MEMORY_REQUEST}
                    limits:
                      cpu: "${CPU_LIMIT}"
                      memory: ${MEMORY_LIMIT}
              imagePullSecrets:
                - name: harbor
              nodeSelector:
                kubernetes.io/os: linux
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: NotIn
                            values:
                              - appmana-032
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels:
                      jobset.sigs.k8s.io/jobset-name: gsvb-trainer
