import org.apache.tools.ant.taskdefs.condition.Os

buildscript {
  ext {
    grpcWindowsArtifactsUrl = 'https://packages.grpc.io/archive/2020/11/adf6b33c3d0283dc4c3d70b1ad6f5fa01ca5b69a-ec34da51-aac4-4cc4-afde-1d74252db27c/protoc/grpc-protoc_windows_x64-1.35.0-dev.zip'
    grpcUnityArtifactsUrl = 'https://packages.grpc.io/archive/2020/11/adf6b33c3d0283dc4c3d70b1ad6f5fa01ca5b69a-ec34da51-aac4-4cc4-afde-1d74252db27c/csharp/grpc_unity_package.2.35.0-dev202011301311.zip'
  }
  repositories {
    mavenLocal()
    mavenCentral()
  }
}

plugins {
  id 'idea'
  id 'com.google.protobuf' version '0.9.4'
  id 'java-library'
  id "com.github.node-gradle.node"
}

configurations {
  protocPlugin
}

apply from: "../gradle/instrument.gradle"
apply from: "../gradle/node.gradle"

def isWindows = Os.isFamily(Os.FAMILY_WINDOWS)
def csharpRootDir = 'src/main/csharp/HiddenSwitch'
def dotnetCmd = ["dotnet"]
def csharpGrpcPath = "";
if (isWindows) {
  csharpGrpcPath = "$project.rootProject.projectDir/bin/grpc_csharp_plugin.exe"
} else if (Os.isFamily(Os.FAMILY_MAC)) {
  dotnetCmd = ["/opt/homebrew/bin/dotnet"]
  csharpGrpcPath = "$project.rootProject.projectDir/bin/grpc_csharp_plugin"
} else {
  csharpGrpcPath = "$project.rootProject.projectDir/bin/linux/grpc_csharp_plugin"
}
def protocGenTsProtoPath = "$rootProject.projectDir/node_modules/.bin/protoc-gen-ts_proto" + (isWindows ? ".cmd" : "")

evaluationDependsOn(":vertx-grpc:vertx-grpc-protoc-plugin2")
evaluationDependsOn(':spellsource-ts-proto')

dependencies {
  implementation "io.vertx:vertx-core:$vertxVersion"
  api group: 'javax.annotation', name: 'javax.annotation-api', version: '1.3.2'
  // https://mvnrepository.com/artifact/com.google.api.grpc/proto-google-common-protos
  api group: 'com.google.api.grpc', name: 'proto-google-common-protos', version: googleCommonsProtosVersion
  api(group: 'com.google.protobuf', name: 'protobuf-java-util', version: protocVersion) {
    exclude group: 'com.google.code.gson', module: 'gson'
  }
  api("com.google.protobuf:protobuf-java:$protocVersion") {
    exclude group: 'com.google.code.gson', module: 'gson'
  }
  api("com.google.protobuf:protobuf-java-util:$protocVersion") {
    exclude group: 'com.google.code.gson', module: 'gson'
  }
  api("io.grpc:grpc-services:$grpcVersion") {
    exclude group: 'com.google.code.gson', module: 'gson'
  }
  api("org.curioswitch.curiostack:protobuf-jackson:2.6.0")
  api('com.netflix.concurrency-limits:concurrency-limits-grpc:0.3.6') {
    exclude group: 'com.google.protobuf', module: 'protobuf-java'
    exclude group: 'com.google.code.gson', module: 'gson'
  }
  api("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion") {
    exclude group: 'jakarta.xml.bind', module: '*'
    exclude group: 'jakarta.activation', module: '*'
  }

  api project(":vertx-grpc:vertx-grpc-client")
  api project(":vertx-grpc:vertx-grpc-server")
  api project(":vertx-grpc:vertx-grpc-context-storage")

  protocPlugin project(path: ':vertx-grpc:vertx-grpc-protoc-plugin2', configuration: 'shadow')
}

clean {
  delete csharpRootDir + '/Framework/bin'
  delete csharpRootDir + '/Framework/obj'
  delete csharpRootDir + '/Framework.Tests/bin'
  delete csharpRootDir + '/Framework.Tests/obj'
}

tasks.register('copyCsharpGrpc', Copy) {
  dependsOn += [":spellsource-protos:generateProto"]
  from(layout.buildDirectory.dir("generated/source/proto/main/csharp/Hiddenswitch/Framework/Sources")) {
    include '**/*.cs'
  }
  into("$csharpRootDir/Framework/Sources")
}

tasks.register('dll', Exec) {
  dependsOn copyCsharpGrpc
  workingDir csharpRootDir
  outputs.dir(layout.buildDirectory.dir("dlls"))
  outputs.cacheIf { true }
  inputs.dir("$csharpRootDir/Framework/Plugins").withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file("$csharpRootDir/HiddenSwitch.sln").withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file("$csharpRootDir/Framework/Framework.csproj").withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir("$csharpRootDir/Framework/Sources").withPathSensitivity(PathSensitivity.RELATIVE)
  // this is using docker-wrapped dotnet
  commandLine dotnetCmd + ['publish', '--output', "$project.buildDir/dlls"]
}

tasks.register('testDll', Exec) {
  dependsOn dll
  inputs.files(csharpRootDir + '/Framework.Tests/**/*.cs', csharpRootDir + '/Framework.Tests/**/*.csproj').withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(layout.buildDirectory.dir("nunit"))
  outputs.cacheIf { true }
  workingDir csharpRootDir
  // this is using docker-wrapped dotnet
  commandLine dotnetCmd + ['test', '--results-directory', "$project.buildDir/nunit"]
}

tasks.register('installDll', Copy) {
  dependsOn dll
  inputs.dir(layout.buildDirectory.dir("dlls")).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir("$csharpRootDir/Framework/Plugins").withPathSensitivity(PathSensitivity.RELATIVE)
  def destination = project(':spellsource-client').projectDir.path + '/src/unity/Assets/Client'
  outputs.dir(destination)
  outputs.cacheIf { true }
  from("$project.buildDir/dlls") {
    include 'Framework.dll'
    include 'Framework.pdb'
  }
  from("$csharpRootDir/Framework/Plugins") {
    include '**/*.*'
  }
  into(destination)
}

tasks.register('protosChanged') {
  group("spellsource")
  description('Run whenever the files in src/main/proto have been changed. Recreates the models and updates the client.')
  dependsOn += [installDll, ':spellsource-protos:generateProto']
}

protobuf {
  protoc {
    artifact = "com.google.protobuf:protoc:$protocVersion"
  }
  plugins {
    grpc_java {
      artifact = "io.grpc:protoc-gen-grpc-java:$grpcVersion"
    }
    grpc_java_vertx {
      path = tasks.getByPath(':vertx-grpc:vertx-grpc-protoc-plugin2:shadowJar').archiveFile.get().asFile
    }
    grpc_csharp {
      path = csharpGrpcPath
    }
    grpc_ts_client {
      path = protocGenTsProtoPath
    }
    grpc_ts_server {
      path = protocGenTsProtoPath
    }
  }
  generateProtoTasks {
    all().each { task ->
      task.dependsOn ':vertx-grpc:vertx-grpc-protoc-plugin2:shadowJar'
    }

    all()*.builtins {
      java {}
      csharp {
        outputSubDir = "csharp/Hiddenswitch/Framework/Sources"
        option 'serializable'
      }
    }
    all()*.plugins {
      grpc_java {
        outputSubDir = "java"
      }
      grpc_java_vertx {
        outputSubDir = "java"
      }
      grpc_csharp {
        outputSubDir = "csharp/Hiddenswitch/Framework/Sources"
      }
      grpc_ts_client {
        outputSubDir = "ts-client"
        option "outputClientImpl=grpc-web"
        option "forceLong=number"
        option "esModuleInterop=true"
        option "oneof=unions"
        option "outputJsonMethods=false"
        option "exportCommonSymbols=true"
        option "lowerCaseServiceMethods=true"
      }
      grpc_ts_server {
        outputSubDir = "ts-server"
        option "outputServices=grpc-js"
        option "esModuleInterop=true"
        option "forceLong=number"
        option "oneof=unions"
        option "outputJsonMethods=false"
        option "exportCommonSymbols=true"
        option "lowerCaseServiceMethods=true"
      }
    }
  }
}


compileJava {
  dependsOn += [':spellsource-protos:generateProto']
}


// --- REFACTORED BLOCK ---
// Define layout properties at the top for clarity and reuse.
// These represent the intermediate directories for our task pipeline.
def copiedProtosDir = layout.buildDirectory.dir('copied-protos')
def formattedSourcesDir = layout.buildDirectory.dir('formatted-sources-for-tsc')

afterEvaluate {
  /**
   * TASK 1: generateProto
   * This task is configured by the protobuf plugin. We ensure its dependencies are set.
   */
  tasks.named('generateProto').configure {
    dependsOn ':spellsource-ts-proto:compileTypescript', ':yarnWorkspace'
  }

  tasks.register('copyAndModifyProto', Copy) {
    dependsOn tasks.named('generateProto')

    from("$buildDir/generated/source/proto/main/ts-client") {
      into 'experimental/client'
    }
    from("$buildDir/generated/source/proto/main/ts-server") {
      into 'experimental/server'
    }
    into("$buildDir/dist")

    // Use filter to perform the text replacement during the copy action.
    // This is more efficient and reliable than a separate doLast block.
    filter { line ->
      line.replace("export class MatchmakingClientImpl", "// @ts-ignore\nexport class MatchmakingClientImpl")
          .replace("export class HiddenSwitchSpellsourceAPIServiceClientImpl", "// @ts-ignore\nexport class HiddenSwitchSpellsourceAPIServiceClientImpl")
          .replace("string | undefined.fromPartial(request)", "request")
    }

    outputs.dir("$buildDir/dist/experimental")
  }

  /**
   * TASK 3: prettierFormat
   * Takes modified generated files and project source files, formats them into a new directory.
   * READS FROM: build/copied-protos/ AND src/main/javascript/
   * WRITES TO: build/formatted-sources-for-tsc/
   */
  tasks.register('prettierFormat', YarnTask) {
    def copyAndModifyProtoTask = tasks.named('copyAndModifyProto')
    dependsOn copyAndModifyProtoTask

    // --- FIX: Use a lazy provider for the input files ---
    // This prevents Gradle from checking for the directory's existence during the configuration phase.
    // It correctly wires the output of the previous task as the input for this one.
    inputs.files(copyAndModifyProtoTask)
    inputs.dir('src/main/javascript')
    outputs.dir(formattedSourcesDir)
    outputs.cacheIf { true }

    // This doFirst block prepares the directory that Prettier will operate on.
    doFirst {
      // Clean the output directory before copying
      project.delete(formattedSourcesDir)
      // Copy all necessary source files into the clean output directory.
      copy {
        from(inputs.files)
        into(formattedSourcesDir)
      }
    }

    // Point prettier to our clean, prepared directory to format the files in-place there.
    args = ["--cwd", "$projectDir", "prettier", "--write", formattedSourcesDir.get().asFile.absolutePath]
  }

  /**
   * TASK 4: compileTypescript
   * Compiles the final, formatted TypeScript files from the intermediate directory.
   * READS FROM: build/formatted-sources-for-tsc/
   * WRITES TO: build/dist/ and build/src/main/javascript/
   */
  tasks.register('compileTypescript', YarnTask) {
    dependsOn tasks.named('prettierFormat')

    // Its ONLY input is the clean output from the previous step in the chain.
    inputs.dir(formattedSourcesDir)

    // Outputs remain the same.
    outputs.dir('build/compiled')
    outputs.cacheIf { true }

    // The tsc command remains the same.
    args = ["run", "-T", "tsc"]

    doFirst {
      copy {
        from "$buildDir/formatted-sources-for-tsc"
        into "$buildDir/compiled"
      }
    }

    doLast {
      copy {
        from "$buildDir/compiled"
        into "dist"
      }
      // todo: ugh
      delete "dist/client"
      delete "dist/server"
    }
  }
}