buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "org.jooq:jooq-codegen:3.17.3"
    classpath "org.postgresql:postgresql:$postgresqlVersion"
  }
}


plugins {
  id 'docker'
  id 'com.google.cloud.tools.jib' version "$googleContainerToolsJibVersion"
  id "org.flywaydb.flyway" version "$flywayVersion"
  id 'com.gradleup.shadow' version "$shadowPluginVersion"
  id 'org.javamodularity.moduleplugin'
  id 'idea'
  id 'application'
  id "io.github.kobylynskyi.graphql.codegen" version "5.9.0"
}

apply from: '../gradle/instrument.gradle'

repositories {
  maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
}

evaluationDependsOn(':spellsource-containers')

configurations {
  jooqGenerator
}

import com.bmuschko.gradle.docker.tasks.container.DockerCreateContainer
import com.bmuschko.gradle.docker.tasks.container.DockerRemoveContainer
import com.bmuschko.gradle.docker.tasks.container.DockerStartContainer
import com.bmuschko.gradle.docker.tasks.container.DockerStopContainer
import com.bmuschko.gradle.docker.tasks.image.DockerPullImage
import com.kobylynskyi.graphql.codegen.model.ApiInterfaceStrategy
import org.apache.tools.ant.taskdefs.condition.Os
import org.jooq.codegen.GenerationTool
import org.jooq.meta.jaxb.*

def isWindows = Os.isFamily(Os.FAMILY_WINDOWS)
def localUsername = 'admin'
def localPassword = 'password'
def localDatabaseName = 'spellsource'
def localPort = '5432'
def mainClassNameConst = 'com.hiddenswitch.framework.EntryPoint'
def jdbcUrl = "jdbc:postgresql://localhost:5432/$localDatabaseName"
def jvmArgs = ['--enable-preview', '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '-XX:+UseContainerSupport', '-XX:MaxRAMPercentage=80.0', '-XX:+UseG1GC', '-XX:MinHeapFreeRatio=10', '-XX:MaxHeapFreeRatio=20', '-XX:-ShrinkHeapInSteps', '-XX:G1PeriodicGCInterval=10000']

dependencies {
  compileOnly 'org.infinispan:infinispan-component-annotations:15.0.11.Final'

  implementation project(':spellsource-common')
  implementation project(':spellsource-game')
  implementation project(':spellsource-cards-git')
  implementation "io.github.classgraph:classgraph:$classgraphVersion"
  implementation group: 'io.vertx', name: 'vertx-infinispan', version: vertxVersion
  implementation group: 'io.vertx', name: 'vertx-web-client', version: vertxVersion
  implementation group: 'io.vertx', name: 'vertx-service-discovery', version: vertxVersion
  implementation group: 'io.vertx', name: 'vertx-web', version: vertxVersion
  implementation group: 'io.vertx', name: 'vertx-auth-jwt', version: vertxVersion
  implementation group: 'io.vertx', name: 'vertx-web-graphql', version: vertxVersion
  implementation "io.vertx:vertx-rx-java3:$vertxVersion"
  implementation 'javax.activation:activation:1.1.1'

  // keycloak
  implementation 'net.openhft:zero-allocation-hashing:0.16'
  implementation platform("org.keycloak.bom:keycloak-bom-parent:$keycloakVersion")
  implementation(group: 'org.keycloak', name: 'keycloak-admin-client', version: "$keycloakVersion") {
    exclude group: 'org.jboss.resteasy', module: 'resteasy-client'
  }
  implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
  implementation "org.keycloak:keycloak-server-spi:$keycloakVersion"
  implementation "org.keycloak:keycloak-server-spi-private:$keycloakVersion"

  implementation "ch.qos.logback:logback-classic:$logbackVersion"

  implementation group: 'com.lambdaworks', name: 'scrypt', version: '1.4.0'
  implementation group: 'commons-validator', name: 'commons-validator', version: '1.7'
  implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-smile:$jacksonVersion") {
    exclude group: 'jakarta.xml.bind', module: '*'
    exclude group: 'jakarta.activation', module: '*'
  }
  implementation("com.fasterxml.jackson.module:jackson-module-afterburner:$jacksonVersion") {
    exclude group: 'jakarta.xml.bind', module: '*'
    exclude group: 'jakarta.activation', module: '*'
  }

  implementation("com.avast.grpc.jwt:grpc-java-jwt:0.5.8") {
    exclude group: 'com.google.code.gson'
    exclude group: 'io.grpc'
    exclude group: 'org.keycloak'
  }

  implementation("org.postgresql:postgresql:$postgresqlVersion") {
    exclude group: 'org.checkerframework', module: 'checker-qual'
  }

  implementation("org.jboss.resteasy:resteasy-client:$resteasyVersion") {
    exclude group: 'io.vertx', module: 'vertx-core'
  }

  implementation group: "io.netty", name: "netty-resolver-dns-native-macos", version: nettyVersion, classifier: "osx-aarch_64"
  implementation 'org.jooq:jooq:3.17.3'
  implementation "io.vertx:vertx-pg-client:$vertxVersion"
  implementation(project(':vertx-jooq-fork:vertx-jooq-classic-reactive')) {
    exclude group: "io.vertx", module: '*'
  }

  implementation group: 'io.vertx', name: 'vertx-auth-common', version: vertxVersion
  implementation(group: 'io.vertx', name: 'vertx-opentracing', version: vertxVersion) {
    exclude group: 'io.jaegertracing', module: '*'
  }
  implementation "io.vertx:vertx-micrometer-metrics:$vertxVersion"
  implementation "io.micrometer:micrometer-core:$micrometerVersion"
  implementation "io.micrometer:micrometer-registry-prometheus:$micrometerVersion"
  implementation "io.micrometer:micrometer-registry-jmx:$micrometerVersion"
  implementation 'com.be-hase.grpc-micrometer:grpc-micrometer:0.0.2'
  implementation 'io.opentracing.contrib:opentracing-grpc:0.2.3'
  implementation "io.jaegertracing:jaeger-client:$jaegerVersion"
  implementation("com.github.marschall:micrometer-jfr:1.10.0") {
    exclude group: 'io.micrometer', module: 'micrometer-core'
  }
  implementation "org.flywaydb:flyway-core:$flywayVersion"
  implementation 'org.redisson:redisson:3.40.1'
  implementation(group: 'com.github.pcj', name: 'google-options', version: '1.0.0') {
    exclude group: 'com.google.guava', module: 'guava'
  }

  implementation "io.github.kobylynskyi:graphql-java-codegen:5.9.0"
  implementation 'com.graphql-java-kickstart:graphql-java-tools:13.0.5'
  implementation 'com.graphql-java:graphql-java:20.7'
  implementation 'com.graphql-java:graphql-java-extended-scalars:20.2'


  testImplementation "ch.qos.logback:logback-classic:$logbackVersion"
  testImplementation(project(':spellsource-containers'))
  testImplementation project(':spellsource-testutils')
  testImplementation("org.testcontainers:testcontainers:$testcontainersVersion")
  testImplementation("org.testcontainers:junit-jupiter:$testcontainersVersion")
  testImplementation group: 'io.vertx', name: 'vertx-junit5', version: vertxVersion
  testImplementation group: 'io.vertx', name: 'vertx-web-client', version: vertxVersion
  testImplementation group: 'io.vertx', name: 'vertx-web-common', version: vertxVersion
  testImplementation "com.google.guava:guava:$guavaVersion"
  testImplementation "io.github.classgraph:classgraph:$classgraphVersion"
  testImplementation 'org.jetbrains:annotations'
  testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
  testImplementation "org.junit.jupiter:junit-jupiter-params:$junitVersion"
  testImplementation 'uk.org.webcompere:system-stubs-jupiter:2.0.2'

  testRuntimeOnly "org.junit.platform:junit-platform-launcher"

  jooqGenerator project(':vertx-jooq-fork:vertx-jooq-generate')
  jooqGenerator project(':vertx-jooq-fork:vertx-jooq-shared')
  jooqGenerator "org.postgresql:postgresql:$postgresqlVersion"
  jooqGenerator "io.vertx:vertx-core:$vertxVersion"
}

javadoc {
  def javadocOptions = options as CoreJavadocOptions
  javadocOptions.addStringOption("source", "20")
  javadocOptions.addBooleanOption("-enable-preview", true)
}

jar {
  manifest {
    attributes 'Main-Class': mainClassNameConst
  }
}

shadowJar {
  mergeServiceFiles()
  zip64 true
  manifest {
    attributes 'Main-Class': mainClassNameConst
  }
}

run {
  group('spellsource')
  description("Starts the Spellsource server locally. Starts all dependencies using Docker (must be installed).")
  dependsOn += [classes, testClasses]
  classpath sourceSets.test.runtimeClasspath
  mainClass.set('com.hiddenswitch.framework.tests.applications.EntryPoint')
  // to preserve sql db for keycloak as a practical matter
  environment("TESTCONTAINERS_REUSE_ENABLE", "true")
  jvmArgs.addAll(jvmArgs)
}

artifacts {
  archives shadowJar
}

application {
  mainClass.set(mainClassNameConst)
}


tasks.register('stopExistingPostgresContainer', DockerStopContainer) {
  containerId.set('gradleSupabasePostgres')
  onError({})
}

tasks.register('removeExistingPostgresContainer', DockerRemoveContainer) {
  dependsOn stopExistingPostgresContainer
  containerId.set('gradleSupabasePostgres')
  onError({})
}

tasks.register('pullPostgresImage', DockerPullImage) {
  image.set("docker.io/postgres:13.11-bullseye")
}

tasks.register('pullKeycloakImage', DockerPullImage) {
  image.set("quay.io/keycloak/keycloak:20.0")
}

tasks.register('createPostgresContainer', DockerCreateContainer) {
  dependsOn += [removeExistingPostgresContainer, pullPostgresImage]
  imageId.set("docker.io/postgres:13.11-bullseye")
  containerName.set('gradleSupabasePostgres')
  hostConfig.portBindings.set(['5432:5432'])
  entrypoint.set(["/bin/bash", "-c", "mkdir -pv /docker-entrypoint-initdb.d/ && echo 'create schema if not exists keycloak;' > /docker-entrypoint-initdb.d/init.sql && docker-entrypoint.sh postgres"])
  cmd.set([])
  envVars.putAll([
      'POSTGRES_DB'      : localDatabaseName,
      'POSTGRES_USER'    : localUsername,
      'POSTGRES_PASSWORD': localPassword, 'POSTGRES_PORT': localPort])
  hostConfig.autoRemove.set(true)
}

tasks.register('startPostgresContainer', DockerStartContainer) {
  dependsOn createPostgresContainer
  targetContainerId createPostgresContainer.getContainerId()
  doLast {
    sleep(12000)
  }
}

tasks.register('stopPostgresContainer', DockerStopContainer) {
  targetContainerId createPostgresContainer.getContainerId()
}

tasks.register('createKeycloakContainer', DockerCreateContainer) {
  dependsOn += [createPostgresContainer, pullKeycloakImage]
  imageId.set("quay.io/keycloak/keycloak:22.0.3")
  envVars.putAll([
      'KEYCLOAK_ADMIN_USERNAME': "admin",
      'KEYCLOAK_ADMIN_PASSWORD': 'password',
      'KC_DB'                  : 'postgres',
      'KC_DB_URL_HOST'         : 'gradleSupabasePostgres',
      'KC_DB_URL_PORT'         : localPort,
      'KC_DB_URL_DATABASE'     : localDatabaseName,
      'KC_DB_USERNAME'         : localUsername,
      'KC_DB_PASSWORD'         : localPassword,
      'KC_DB_SCHEMA'           : 'keycloak',
      'KC_HOSTNAME_STRICT'     : 'false',
      'KC_FEATURES'            : 'declarative-user-profile'
  ])
  cmd.set(["start-dev"])
  hostConfig.autoRemove.set(true)
  hostConfig.portBindings.set(["8080:8080"])
  hostConfig.links.set(['gradleSupabasePostgres:gradleSupabasePostgres'])
}

tasks.register('startKeycloakContainer', DockerStartContainer) {
  dependsOn += [createKeycloakContainer, startPostgresContainer]
  targetContainerId createKeycloakContainer.getContainerId()
  doLast {
    sleep(30000)
  }
}

tasks.register('stopKeycloakContainer', DockerStopContainer) {
  targetContainerId createKeycloakContainer.getContainerId()
}

tasks.register('jooqGenerate') {
  // Do all migrations first
  dependsOn flywayMigrate
  finalizedBy = [stopKeycloakContainer, stopPostgresContainer]
  def outputDir = "$project.projectDir/src/main/java"

  inputs.dir("$project.projectDir/src/main/resources/db/migration")
  outputs.dir(outputDir + '/com/hiddenswitch/framework/schema')

  def configuration = new Configuration()
  configuration
      .withJdbc(new Jdbc()
          .withDriver('org.postgresql.Driver')
          .withUrl(jdbcUrl)
          .withUser(localUsername)
          .withPassword(localPassword))
      .withGenerator(new Generator()
          .withName('io.github.jklingsporn.vertx.jooq.generate.classic.ClassicReactiveVertxGenerator')
          .withDatabase(new Database()
              .withName('org.jooq.meta.postgres.PostgresDatabase')
              .withSchemata(new SchemaMappingType().withInputSchema("keycloak").withOutputSchema('keycloak'),
                  new SchemaMappingType().withInputSchema("spellsource").withOutputSchema('spellsource'),
                  new SchemaMappingType().withInputSchema("hiddenswitch").withOutputSchema("hiddenswitch"))
              .withForcedTypes(
                  new ForcedType()
                      .withUserType('io.vertx.core.json.JsonObject')
                      .withConverter('io.github.jklingsporn.vertx.jooq.shared.postgres.JSONBToJsonObjectConverter')
                      .withIncludeTypes("jsonb"))
              .withIncludeTables(true)
              .withIncludeRoutines(true)
              .withIncludePackages(false)
              .withIncludeUDTs(true)
              .withIncludeSequences(true)
              .withExcludes('schema_version')
              .withIncludes('.*'))
          .withGenerate(new Generate()
              .withDeprecated(false)
              .withRecords(true)
              .withInterfaces(true)
              .withFluentSetters(true)
              .withPojos(true)
              .withDaos(true))
          .withTarget(new Target()
              .withPackageName('com.hiddenswitch.framework.schema')
              .withDirectory(outputDir))
          .withStrategy(new Strategy()
              .withName('io.github.jklingsporn.vertx.jooq.generate.VertxGeneratorStrategy')))

  doLast() {
    def cl = new URLClassLoader(
        configurations.jooqGenerator.files.collect { it.toURI().toURL() } as URL[],
        GenerationTool.classLoader
    )
    Thread.currentThread().setContextClassLoader(cl)
    GenerationTool.generate(configuration)
    exec {
      // dump the generated ddl to a file
      workingDir project.projectDir
      // this is using docker-wrapped pg_dump
      environment('PGPASSWORD', localPassword)
      environment('PGDATABASE', localDatabaseName)
      environment('PGUSER', localUsername)
      def containerId = startPostgresContainer.containerId.get()
      environment('DOCKER_OPTS', "--link " + containerId + ":database")
      if (isWindows) {
        // postgres is bound to localhost
        commandLine "$project.rootProject.projectDir\\bin\\pg_dump.exe", '-h', 'localhost', '-s', '-f', "$project.projectDir\\src\\main\\resources\\db\\ddl.sql"
      } else {
        commandLine "$project.rootProject.projectDir/bin/pg_dump", '-h', "database", '-s', '-f', "/git/$project.projectDir.name/src/main/resources/db/ddl.sql"
      }
    }
  }
}

tasks.register('migrationsOrSqlChanged') {
  group('spellsource')
  description("Run whenever the schema as encoded in $project.projectDir.name/src/main/resources/db/migration has changed - recreates the JOOQ DSL and dumps a ddl.sql file for autocompletion")
  dependsOn += [jooqGenerate]
}

flyway {
  url = jdbcUrl
  user = localUsername
  password = localPassword
  schemas = ['hiddenswitch', 'spellsource']
  locations = ['filesystem:src/main/resources/db/migration']
}

// Make sure keycloak has done its migration first
flywayMigrate.dependsOn += [startKeycloakContainer]

test {
  group('spellsource')
  useJUnitPlatform()
  enableAssertions = false
  maxHeapSize = '16g'
  it.jvmArgs '-XX:+UseG1GC', '-XX:MinHeapFreeRatio=10', '-XX:MaxHeapFreeRatio=20', '-XX:-ShrinkHeapInSteps', '-XX:G1PeriodicGCInterval=10000'
  systemProperty("vertx.grpc.stack.traces", "true")
  testLogging {
    showExceptions true
    exceptionFormat "full"
    showCauses true
    showStackTraces true
  }
}

def spellsourceTags = ['latest', project.version.toString()]
def spellsourceImage = 'ghcr.io/hiddenswitch/spellsource'
jib {
  from {
    image = "eclipse-temurin:24-ubi9-minimal"
  }
  to {
    image = spellsourceImage
    tags = spellsourceTags
    if (System.getenv('GITHUB_ACTIONS') != null) {
      auth {
        username = System.getenv('GITHUB_ACTOR') ?: ''
        password = System.getenv('GITHUB_TOKEN') ?: ''
      }
    }
  }
  container {
    ports = ['8080']
    jvmFlags = jvmArgs
  }
}

tasks.register('githubDockerPush') {
  dependsOn 'jib'
}

graphqlCodegen {
  // all config options: 
  // https://github.com/kobylynskyi/graphql-java-codegen/blob/main/docs/codegen-options.md
  graphqlSchemaPaths = [file("src/main/resources/schema.graphqls").path]
  outputDir = file("src/main/java/com/hiddenswitch/framework/graphql")
  packageName = "com.hiddenswitch.framework.graphql"
  customTypesMapping = [
      DateTime: "org.joda.time.DateTime",
      BigInt: "java.lang.Long"
  ]
  customAnnotationsMapping = [
      DateTime: ["@com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = com.example.json.EpochMillisScalarDeserializer.class)"]
  ]
  addGeneratedAnnotation = false
  modelValidationAnnotation = ""
  typeResolverSuffix = "TypeResolver"
  apiInterfaceStrategy = ApiInterfaceStrategy.DO_NOT_GENERATE
  apiReturnType = "io.vertx.core.Future"
  subscriptionReturnType = "org.reactivestreams.Publisher"
  // generateDataFetchingEnvironmentArgumentInApis = true
  
  doLast {
    copy {
      from "${outputDir.path}/com/hiddenswitch/framework/graphql"
      into outputDir.path
    }
    delete "${outputDir.path}/com"
  }
}

tasks.register("generateSchema", JavaExec) {
  group('spellsource')
  description("Starts the full server stack, waits for the stitched GraphQL schema to be generated, then exits.")
  dependsOn += [classes, testClasses]
  classpath sourceSets.test.runtimeClasspath
  mainClass.set('com.hiddenswitch.framework.tests.applications.SchemaGeneratorEntryPoint')
  environment("TESTCONTAINERS_REUSE_ENABLE", "true")
  jvmArgs.addAll(jvmArgs)
  outputs.file(rootProject.file("spellsource-graphql/schema.graphql"))
}