fragment gameState on GameState {
  entities {
    ...entity
  }
  isLocalPlayerTurn
  turnNumber
  turnState
  timestamp
  hasPowerHistory
  powerHistory {
    eventType
    id
    description
    isPowerHistory
    isSourcePlayerLocal
    isTargetPlayerLocal
    source {
      ...entitySummary
    }
    target {
      ...entitySummary
    }
    targets {
      ...entitySummary
    }
    value
    cardEvent {
      card {
        ...entitySummary
      }
      showLocal
    }
  }
}
