fragment serverGameMessage on ServerGameMessage {
  messageType
  id
  localPlayerId
  isReplayMessage
  gameState {
    ...gameState
  }
  actions {
    all {
      ...spellAction
    }
    compatibility
  }
  startingCards {
    ...entitySummary
  }
  event {
    eventType
    id
    description
    isPowerHistory
    isSourcePlayerLocal
    isTargetPlayerLocal
    source {
      ...entitySummary
    }
    target {
      ...entitySummary
    }
    targets {
      ...entitySummary
    }
    value
    cardEvent {
      card {
        ...entitySummary
      }
      showLocal
    }
    entityTouched
    entityUntouched
  }
  gameOver {
    localPlayerWon
    winningPlayerId
  }
  emote {
    entityId
    message
  }
  timers {
    millisRemaining
  }
  changedEntityIds
}
