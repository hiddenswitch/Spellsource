plugins {
  id 'base'
}

version "1.0.0"

def keycloakDockerDir = project(':spellsource-containers').layout.projectDirectory.dir("src/main/resources/docker/keycloak").asFile
def themeJarName = "${project.name}-${project.version}.jar"

tasks.register('buildTheme', Jar) {
  def fs = services.get(org.gradle.api.file.FileSystemOperations)
  inputs.dir 'src'
  inputs.file 'keycloak-themes.json'

  into "theme/spellsource-keycloak-theme/", {
    from "${projectDir}/src/"
  }

  metaInf {
    from 'keycloak-themes.json'
  }

  doLast {
    fs.copy {
      from outputs.files
      into keycloakDockerDir

      rename themeJarName, "spellsource-keycloak-theme.jar"
    }
  }
}

build.dependsOn buildTheme